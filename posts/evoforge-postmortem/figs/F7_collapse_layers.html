const PAD = {"zh":[9,8,13,15],"en":[9,8,13,15]};
const FIG = {
  state: { layer: 'all' },
  controls: [{ id: 'layer', type: 'buttons', label: 'ctlLayer', options: [{ v: 'all', k: 'allL' }, { v: '1', k: 'l1' }, { v: '2', k: 'l2' }, { v: '3', k: 'l3' }] }],
  COL: [PAL.c2, PAL.c3, PAL.c1],
  geo: function () { return { W: 1100, H: 626, cw: 352, gap: 14, x0: 8, y0: 46, ch: 522 }; },
  click: function (id, st) { var v = id.replace('L', ''); st.layer = st.layer === v ? 'all' : v; return true; },
  sheet: function (x, y, w, h, c, seed, o) {
    o = o || {}; var r = rng(seed), s = path(wobRect(x, y, w, h, seed, 0.8), { fill: o.fill || PAL.paper, stroke: c, 'stroke-width': o.sw || 1.8 });
    var n = Math.max(2, Math.floor((h - 8) / 6)); for (var i = 0; i < n; i++) { var lw = (w - 10) * (0.35 + r() * 0.6); s += line(x + 5, y + 6 + i * 6, x + 5 + lw, y + 6 + i * 6, { stroke: c, 'stroke-width': 1.3, opacity: 0.7 }); }
    return s;
  },
  arrow: function (x1, y1, x2, y2, c, dash) {
    var a = Math.atan2(y2 - y1, x2 - x1), hl = 7;
    return line(x1, y1, x2, y2, { stroke: c, 'stroke-width': 1.6, 'stroke-dasharray': dash || null, 'stroke-linecap': 'round' }) + path('M' + x2 + ',' + y2 + ' L' + (x2 - hl * Math.cos(a - 0.5)) + ',' + (y2 - hl * Math.sin(a - 0.5)) + ' M' + x2 + ',' + y2 + ' L' + (x2 - hl * Math.cos(a + 0.5)) + ',' + (y2 - hl * Math.sin(a + 0.5)), { stroke: c, 'stroke-width': 1.6, fill: 'none', 'stroke-linecap': 'round' });
  },
  gaugeBar: function (x, y, w, v0, v1, c, lbl, valTxt) {
    var s = text(x, y - 8, lbl, { size: 11.5, fill: PAL.muted });
    s += rect(x, y, w, 12, { rx: 6, fill: PAL.paper, stroke: PAL.ink, 'stroke-width': 1.5 });
    s += rect(x + 1.5, y + 1.5, Math.max(4, (w - 3) * v1), 9, { rx: 4.5, fill: c });
    if (v0 !== v1) s += rect(x + 1.5, y + 1.5, (w - 3) * v0, 9, { rx: 4.5, fill: c, opacity: 1 }) + line(x + 1.5 + (w - 3) * v0, y - 2, x + 1.5 + (w - 3) * v0, y + 14, { stroke: PAL.ink, 'stroke-width': 1.2 });
    s += text(x + w + 8, y + 10, valTxt, { size: 13, weight: 700, mono: 1 });
    return s;
  },
  render: function (lang, st) {
    var G = this.geo(); if (lang === 'en') { G.ch = 566; G.H = 672; } var W = G.W, self = this, s = svgOpen(W, G.H, tr(lang, 'title'), tr(lang, 'caption'));
    s += star4(W - 20, 16, 8, { fill: PAL.gold }) + star4(14, 20, 5, { fill: PAL.pink });
    for (var i = 0; i < 3; i++) {
      var on = st.layer === 'all' || st.layer === String(i + 1), x = G.x0 + i * (G.cw + G.gap), y = G.y0, c = this.COL[i];
      s += '<g class="gen" opacity="' + (on ? 1 : 0.28) + '" data-click="L' + (i + 1) + '" tabindex="0" role="button" aria-label="' + esc(tr(lang, 'l' + (i + 1))) + '">';
      s += path(wobRect(x + 4, y + 4, G.cw, G.ch, 5 + i, 1.2), { fill: PAL.shadow }) + path(wobRect(x, y, G.cw, G.ch, 5 + i, 1.2), { fill: PAL.paper, stroke: PAL.ink, 'stroke-width': 2 });
      // layer title band
      s += path(wobRect(x + 10, y + 10, G.cw - 20, 46, 11 + i, 1), { fill: c, 'fill-opacity': 0.2, stroke: c, 'stroke-width': 2.2 });
      s += text(x + 22, y + 31, tr(lang, 'l' + (i + 1)), { size: 17, weight: 700 }) + text(x + 22, y + 48, tr(lang, 'comp' + (i + 1)), { size: 12, fill: PAL.muted });
      // diagram frame
      var dx = x + 14, dy = y + 66, dw = G.cw - 28, dh = 232;
      s += path(wobRect(dx, dy, dw, dh, 31 + i, 1), { fill: PAL.cream, 'fill-opacity': 0.45, stroke: PAL.axis, 'stroke-width': 1.2, 'stroke-dasharray': '4 3' });
      if (i === 0) s += this.diagKag(dx, dy, dw, dh, lang);
      if (i === 1) s += this.diagSb(dx, dy, dw, dh, lang);
      if (i === 2) s += this.diagAi(dx, dy, dw, dh, lang);
      // gauge
      var gy = dy + dh + 56, gl = tr(lang, 'g' + ['k', 's', 'a'][i]);
      s += text(x + 16, gy - 32, tr(lang, 'gauge'), { size: 12, weight: 700 });
      if (i === 0) s += this.gaugeBar(x + 16, gy, 200, 0.90, 0.92, c, gl, '≈ 0.9');
      if (i === 1) s += this.gaugeBar(x + 16, gy, 200, 0.16, 0.21, c, gl, '≈ 0.2');
      if (i === 2) s += this.gaugeBar(x + 16, gy, 200, 0.31, 0.31, c, gl, '≈ 0.3');
      // evidence bullets
      var by = gy + 40, key = ['k', 's', 'a'][i];
      for (var j = 1; j <= 3; j++) {
        var ln = wrap(tr(lang, key + j), G.cw - 58, 12);
        s += '<g data-tip="' + key + j + '">' + circle(x + 22, by - 4, 4.5, { fill: c, stroke: PAL.paper, 'stroke-width': 1.5 }) + text(x + 34, by, ln, { size: 12, lh: 15 }) + '</g>';
        by += ln.length * 15 + 9;
      }
      s += '</g>';
    }
    s += text(14, G.y0 + G.ch + 32, wrap(tr(lang, 'fix'), W - 28, 13), { size: 13, weight: 700 });
    return s + '</svg>';
  },
  diagKag: function (x, y, w, h, lang) {
    var s = '', c = PAL.c2, i;
    var xs = [0.08, 0.22, 0.36, 0.5, 0.64, 0.78, 0.9], r = rng(4);
    // pit
    var px = x + w / 2, py = y + h - 54;
    s += path('M' + (px - 96) + ',' + (py - 6) + ' Q' + px + ',' + (py + 74) + ' ' + (px + 96) + ',' + (py - 6) + ' Z', { fill: PAL.ink, 'fill-opacity': 0.14, stroke: PAL.ink, 'stroke-width': 2 });
    // top sheets
    for (i = 0; i < xs.length; i++) {
      var sx = x + w * xs[i] - 14, sy = y + 12 + (i % 2) * 8;
      s += this.sheet(sx, sy, 28, 34, i < 5 ? PAL.gray : c, 100 + i);
      s += this.arrow(sx + 14, sy + 36, px + (xs[i] - 0.5) * 80, py + 6, PAL.ink, '4 3');
    }
    // copies in pit
    for (i = 0; i < 4; i++) s += this.sheet(px - 34 + i * 7, py - 34 + i * 4, 30, 36, PAL.c3, 200, { fill: PAL.paper });
    s += text(px, py + 52, tr(lang, 'lbl_pit'), { anchor: 'middle', size: 13, weight: 700 });

    return s;
  },
  diagSb: function (x, y, w, h, lang) {
    var s = '', c = PAL.c3, i, n = 5, shapes = [[30, 34], [24, 40], [34, 28], [26, 36], [30, 30]], cols = [PAL.c1, PAL.c2, PAL.c3, PAL.c4, PAL.c1];
    var gx = function (k) { return x + 22 + k * (w - 60) / (n - 1); };
    // lanes
    for (i = 0; i < n; i++) {
      var dead = i > 0;
      s += this.sheet(gx(i) - shapes[i][0] / 2, y + 14, shapes[i][0], shapes[i][1], dead ? PAL.gray : cols[i], 300 + i * 7, { fill: PAL.paper });
    }
    // failed probe on lane 0
    s += text(gx(0), y + 66, '✕', { anchor: 'middle', size: 16, fill: PAL.alert, weight: 700 }) + text(gx(0) - 14, y + 82, wrap(tr(lang, 'lbl_probe'), 90, 11), { size: 11, lh: 13 });
    // door
    var dx = x + w / 2 - 44, dy = y + 112;
    s += path(wobRect(dx, dy, 88, 100, 77, 1.5), { fill: PAL.sky, 'fill-opacity': 0.35, stroke: PAL.ink, 'stroke-width': 2.4 }) + circle(dx + 72, dy + 56, 4, { fill: PAL.gold, stroke: PAL.ink, 'stroke-width': 1 });
    s += path(wobRect(dx + 8, dy + 14, 72, 38, 78, 0.8), { fill: PAL.paper, stroke: PAL.ink, 'stroke-width': 1.4, transform: 'rotate(-3 ' + (dx + 44) + ' ' + (dy + 33) + ')' });
    s += text(dx + 44, dy + 29, wrap(tr(lang, 'lbl_door'), 66, 11.5), { anchor: 'middle', size: 11.5, weight: 700, lh: 13, transform: 'rotate(-3 ' + (dx + 44) + ' ' + (dy + 33) + ')' });
    s += this.arrow(gx(0) + 4, y + 92, dx + 12, dy + 4, PAL.alert);
    for (i = 1; i < n; i++) s += this.arrow(dx + 44, dy - 2, gx(i), y + 56, PAL.gray, '4 3');
    return s;
  },
  diagAi: function (x, y, w, h, lang) {
    var s = '', i, cols = [PAL.c1, PAL.c3, PAL.c2, PAL.c4, PAL.c1, PAL.c3], n = 6, shapes = [[30, 36], [24, 42], [34, 28], [26, 38], [32, 32], [22, 34]];
    // basin (valley)
    var bx = x + w / 2, by = y + h - 40;
    s += path('M' + (x + 20) + ',' + (y + 92) + ' Q' + (x + 70) + ',' + (y + 110) + ' ' + (bx - 70) + ',' + (by - 14) + ' Q' + bx + ',' + (by + 30) + ' ' + (bx + 70) + ',' + (by - 14) + ' Q' + (x + w - 70) + ',' + (y + 110) + ' ' + (x + w - 20) + ',' + (y + 92), { fill: PAL.c1, 'fill-opacity': 0.18, stroke: PAL.ink, 'stroke-width': 2 });
    s += text(bx, by - 8, wrap(tr(lang, 'lbl_basin'), 190, 12), { anchor: 'middle', size: 12, weight: 700, lh: 14 });
    for (i = 0; i < n; i++) {
      var gx = x + 28 + i * (w - 70) / (n - 1), sy = y + 12 + (i % 2) * 10;
      s += this.sheet(gx - shapes[i][0] / 2, sy, shapes[i][0], shapes[i][1], cols[i], 400 + i * 5, { fill: PAL.paper });
      s += this.arrow(gx, sy + shapes[i][1] + 2, bx + (i - 2.5) * 22, by - 22, PAL.ink, '4 3');
    }
    // non-vision routes: outside the basin
    s += this.sheet(x + 10, y + h - 44, 22, 28, PAL.gray, 450, { fill: PAL.paper }) + this.sheet(x + 38, y + h - 44, 22, 28, PAL.gray, 451, { fill: PAL.paper }) + text(x + 66, y + h - 34, wrap(tr(lang, 'lbl_neg'), 60, 10.5), { size: 10.5, fill: PAL.muted, lh: 12 });
    s += text(x + 28, y + h - 48, '✕ ✕', { size: 11, fill: PAL.alert, weight: 700 });
    return s;
  },
  tip: function (id, lang) {
    return { t: tr(lang, 'l' + ({ k: 1, s: 2, a: 3 }[id[0]])), rows: [{ k: tr(lang, id) }] };
  },
  table: function (lang) {
    var rows = []; [['k', 1], ['s', 2], ['a', 3]].forEach(function (e) { for (var j = 1; j <= 3; j++) rows.push([tr(lang, 'l' + e[1]), tr(lang, 'comp' + e[1]), tr(lang, e[0] + j)]); });
    return { head: tr(lang, 'th'), rows: rows };
  }
};

</script>
<script>
/* boot.js - generic page runtime: language toggle, controls, tooltip, click handling, table view.
   Language: default zh; ?lang=en in URL, localStorage('fig-lang'), or window.postMessage({type:'fig-lang',lang:'en'}) from the host page. */
(function () {
  var FIGID = 'F9';
  var st = JSON.parse(JSON.stringify(FIG.state || {}));
  var lang = 'zh';
  try { var q = /[?&]lang=(zh|en)/.exec(location.search); if (q) lang = q[1]; else if (localStorage.getItem('fig-lang')) lang = localStorage.getItem('fig-lang'); } catch (e) { }
  var $ = function (id) { return document.getElementById(id); };
  var mount = $('mount'), tipEl = $('tip');
  if (FIG.init) FIG.init();

  function setText(el, s) { el.textContent = s; }
  function buildControls() {
    var box = $('ctl'); box.textContent = '';
    (FIG.controls || []).forEach(function (c) {
      var lab = document.createElement('label'); lab.appendChild(document.createTextNode(tr(lang, c.label)));
      if (c.type === 'select') {
        var s = document.createElement('select');
        c.options.forEach(function (o) { var op = document.createElement('option'); op.value = o.v; op.textContent = o.k ? tr(lang, o.k) : o.text; if (String(st[c.id]) === String(o.v)) op.selected = true; s.appendChild(op); });
        s.addEventListener('change', function () { st[c.id] = s.value; draw(); });
        lab.appendChild(s);
      } else if (c.type === 'buttons') {
        var gp = document.createElement('span'); gp.className = 'grp';
        c.options.forEach(function (o) {
          var b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = o.k ? tr(lang, o.k) : o.text;
          b.setAttribute('aria-pressed', String(st[c.id]) === String(o.v));
          b.addEventListener('click', function () { st[c.id] = o.v; buildControls(); draw(); });
          gp.appendChild(b);
        });
        lab.appendChild(gp);
      } else if (c.type === 'range') {
        var r = document.createElement('input'); r.type = 'range'; r.min = c.min; r.max = c.max; r.step = c.step; r.value = st[c.id];
        var v = document.createElement('span'); v.className = 'val'; v.textContent = c.fmt ? c.fmt(st[c.id]) : st[c.id];
        r.addEventListener('input', function () { st[c.id] = +r.value; v.textContent = c.fmt ? c.fmt(st[c.id]) : st[c.id]; draw(); });
        lab.appendChild(r); lab.appendChild(v);
      } else if (c.type === 'action') {
        lab.removeChild(lab.firstChild);
        var ab = document.createElement('button'); ab.className = 'btn act'; ab.type = 'button'; ab.textContent = tr(lang, c.label);
        ab.addEventListener('click', function () { if (FIG.click(c.id, st)) draw(); });
        lab.appendChild(ab);
      }
      box.appendChild(lab);
    });
  }
  function buildTable() {
    var t = FIG.table ? FIG.table(lang, st) : null, host = $('tbl'); host.textContent = '';
    if (!t) return;
    var tb = document.createElement('table'), tr0 = document.createElement('tr');
    t.head.forEach(function (h) { var th = document.createElement('th'); th.textContent = h; tr0.appendChild(th); }); tb.appendChild(tr0);
    t.rows.forEach(function (r) { var tr1 = document.createElement('tr'); r.forEach(function (c) { var td = document.createElement('td'); td.textContent = c == null ? '' : c; tr1.appendChild(td); }); tb.appendChild(tr1); });
    host.appendChild(tb);
  }
  function draw() {
    mount.innerHTML = FIG.render(lang, st);   // trusted: generated by FIG.render, all data strings pass through esc()
    buildTable(); hideTip();
    if (FIG.after) FIG.after(mount, lang, st, draw);
  }
  function full() {
    document.documentElement.lang = lang;
    setText($('figno'), FIGID); setText($('title'), tr(lang, 'title'));
    setText($('cap'), tr(lang, 'caption')); setText($('src'), tr(lang, 'srcLabel') + tr(lang, 'src'));
    setText($('tblsum'), tr(lang, 'tableView'));
    $('bzh').setAttribute('aria-pressed', lang === 'zh'); $('ben').setAttribute('aria-pressed', lang === 'en');
    document.title = FIGID + ' ' + tr(lang, 'title');
    buildControls(); draw();
  }
  function setLang(l) { lang = l; try { localStorage.setItem('fig-lang', l); } catch (e) { } full(); }
  $('bzh').addEventListener('click', function () { setLang('zh'); });
  $('ben').addEventListener('click', function () { setLang('en'); });
  window.addEventListener('message', function (e) { if (e.data && e.data.type === 'fig-lang' && (e.data.lang === 'zh' || e.data.lang === 'en')) setLang(e.data.lang); });

  /* tooltip (all text via textContent) */
  function hideTip() { tipEl.style.display = 'none'; }
  function showTip(id, x, y) {
    var d = FIG.tip ? FIG.tip(id, lang, st) : null; if (!d) { hideTip(); return; }
    tipEl.textContent = '';
    if (d.t) { var h = document.createElement('div'); h.className = 'tt'; h.textContent = d.t; tipEl.appendChild(h); }
    (d.rows || []).forEach(function (r) {
      var row = document.createElement('div'); row.className = 'r';
      if (r.c) { var sw = document.createElement('span'); sw.className = 'sw'; sw.style.borderColor = r.c; row.appendChild(sw); }
      if (r.v != null) { var v = document.createElement('span'); v.className = 'v'; v.textContent = r.v; row.appendChild(v); }
      if (r.k) { var k = document.createElement('span'); k.className = 'k'; k.textContent = r.k; row.appendChild(k); }
      tipEl.appendChild(row);
    });
    if (d.n) { var n = document.createElement('div'); n.className = 'n'; n.textContent = d.n; tipEl.appendChild(n); }
    tipEl.style.display = 'block';
    var w = tipEl.offsetWidth, h2 = tipEl.offsetHeight, px = x + 14, py = y + 14;
    if (px + w > window.innerWidth - 4) px = Math.max(4, x - w - 14);
    if (py + h2 > window.innerHeight - 4) py = Math.max(4, y - h2 - 14);
    tipEl.style.left = px + 'px'; tipEl.style.top = py + 'px';
  }
  function tipTarget(e) { var t = e.target; while (t && t !== mount) { if (t.getAttribute && t.getAttribute('data-tip')) return t; t = t.parentNode; } return null; }
  mount.addEventListener('pointermove', function (e) { var t = tipTarget(e); if (t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else hideTip(); });
  mount.addEventListener('pointerleave', hideTip);
  mount.addEventListener('focusin', function (e) { var t = tipTarget(e); if (t) { var r = t.getBoundingClientRect(); showTip(t.getAttribute('data-tip'), r.left + r.width / 2, r.top); } });
  mount.addEventListener('focusout', hideTip);
  mount.addEventListener('click', function (e) {
    var t = e.target; while (t && t !== mount) { if (t.getAttribute && t.getAttribute('data-click')) break; t = t.parentNode; }
    if (t && t !== mount && FIG.click && FIG.click(t.getAttribute('data-click'), st)) draw();
  });
  mount.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target; if (t && t.getAttribute && t.getAttribute('data-click')) { e.preventDefault(); if (FIG.click && FIG.click(t.getAttribute('data-click'), st)) draw(); }
  });
  full();
})();

</script>
