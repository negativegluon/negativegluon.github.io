project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "projects/**/*.qmd"
  resources:
    - /assets/**

lang: en

website:
  title: "Quark's Lunar Room"
  site-url: "https://negativegluon.github.io"
  description: "Personal homepage and blog of Bushi Liu."
  favicon: assets/images/moon-mark.svg
  open-graph: true
  search: false
  back-to-top-navigation: true
  page-navigation: true
  sidebar:
    id: site
    style: docked
    title: "☽QUARK☾の部屋"
    logo: assets/images/moon-mark.svg
    contents:
      - text: "◆Home"
        href: index.qmd
      - text: "◆About"
        href: about.qmd
      - text: "◆Blog"
        href: writing.qmd
      - text: "◆Projects"
        href: projects.qmd
  page-footer:
    left: "© 2026 Bushi Liu"
    center:
      - text: "RSS"
        href: writing.xml
      - text: "GitHub"
        href: https://github.com/negativegluon
      - text: "Scholar"
        href: https://scholar.google.com/citations?user=vfnxkIkAAAAJ
      - text: "Kaggle"
        href: https://www.kaggle.com/quarkliu
      - text: "LinkedIn"
        href: https://www.linkedin.com/in/%E8%A1%A5%E7%9F%B3-%E5%88%98-a525a5448/
    right: "Since 2026 · Best viewed with any browser"

execute:
  freeze: auto

format:
  html:
    theme: default
    toc: true
    toc-title: "On this page"
    code-copy: true
    anchor-sections: true
    css: assets/css/retro.css
    include-in-header: includes/head.html
    include-after-body: includes/after-body.html
