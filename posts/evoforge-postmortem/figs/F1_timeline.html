    this.events().forEach(function (e) { rows.push([tr(lang, 'evn') + ' ' + e.n, hhmm(e.t), tr(lang, 'ev' + e.n), '']); });
    this.lanes().forEach(function (ln) { ln.pts.forEach(function (q) { rows.push([tr(lang, 'lane_' + ln.id), hhmm(q[1]), tr(lang, q[3]) + ' = ' + q[2], '']); }); });
    return { head: [tr(lang, 'lane_sb') + ' / ' + tr(lang, 'evn'), tr(lang, 'rep'), tr(lang, 'val'), ''], rows: rows };
  }
};

</script>
<script>
/* boot.js - generic page runtime: language toggle, controls, tooltip, click handling, table view.
   Language: default zh; ?lang=en in URL, localStorage('fig-lang'), or window.postMessage({type:'fig-lang',lang:'en'}) from the host page. */
(function () {
  var FIGID = 'F3';
  var st = JSON.parse(JSON.stringify(FIG.state || {}));
  var lang = 'zh';
  try { var q = /[?&]lang=(zh|en)/.exec(location.search); if (q) lang = q[1]; else if (localStorage.getItem('fig-lang')) lang = localStorage.getItem('fig-lang'); } catch (e) { }
  var $ = function (id) { return document.getElementById(id); };
  var mount = $('mount'), tipEl = $('tip');
  if (FIG.init) FIG.init();

  function setText(el, s) { el.textContent = s; }
  function buildControls() {
    var box = $('ctl'); box.textContent = '';
    (FIG.controls || []).forEach(function (c) {
      var lab = document.createElement('label'); lab.appendChild(document.createTextNode(tr(lang, c.label)));
      if (c.type === 'select') {
        var s = document.createElement('select');
        c.options.forEach(function (o) { var op = document.createElement('option'); op.value = o.v; op.textContent = o.k ? tr(lang, o.k) : o.text; if (String(st[c.id]) === String(o.v)) op.selected = true; s.appendChild(op); });
        s.addEventListener('change', function () { st[c.id] = s.value; draw(); });
        lab.appendChild(s);
      } else if (c.type === 'buttons') {
        var gp = document.createElement('span'); gp.className = 'grp';
        c.options.forEach(function (o) {
          var b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = o.k ? tr(lang, o.k) : o.text;
          b.setAttribute('aria-pressed', String(st[c.id]) === String(o.v));
          b.addEventListener('click', function () { st[c.id] = o.v; buildControls(); draw(); });
          gp.appendChild(b);
        });
        lab.appendChild(gp);
      } else if (c.type === 'range') {
        var r = document.createElement('input'); r.type = 'range'; r.min = c.min; r.max = c.max; r.step = c.step; r.value = st[c.id];
        var v = document.createElement('span'); v.className = 'val'; v.textContent = c.fmt ? c.fmt(st[c.id]) : st[c.id];
        r.addEventListener('input', function () { st[c.id] = +r.value; v.textContent = c.fmt ? c.fmt(st[c.id]) : st[c.id]; draw(); });
        lab.appendChild(r); lab.appendChild(v);
      } else if (c.type === 'action') {
        lab.removeChild(lab.firstChild);
        var ab = document.createElement('button'); ab.className = 'btn act'; ab.type = 'button'; ab.textContent = tr(lang, c.label);
        ab.addEventListener('click', function () { if (FIG.click(c.id, st)) draw(); });
        lab.appendChild(ab);
      }
      box.appendChild(lab);
    });
  }
  function buildTable() {
    var t = FIG.table ? FIG.table(lang, st) : null, host = $('tbl'); host.textContent = '';
    if (!t) return;
    var tb = document.createElement('table'), tr0 = document.createElement('tr');
    t.head.forEach(function (h) { var th = document.createElement('th'); th.textContent = h; tr0.appendChild(th); }); tb.appendChild(tr0);
    t.rows.forEach(function (r) { var tr1 = document.createElement('tr'); r.forEach(function (c) { var td = document.createElement('td'); td.textContent = c == null ? '' : c; tr1.appendChild(td); }); tb.appendChild(tr1); });
    host.appendChild(tb);
  }
  function draw() {
    mount.innerHTML = FIG.render(lang, st);   // trusted: generated by FIG.render, all data strings pass through esc()
    buildTable(); hideTip();
    if (FIG.after) FIG.after(mount, lang, st, draw);
  }
  function full() {
    document.documentElement.lang = lang;
    setText($('figno'), FIGID); setText($('title'), tr(lang, 'title'));
    setText($('cap'), tr(lang, 'caption')); setText($('src'), tr(lang, 'srcLabel') + tr(lang, 'src'));
    setText($('tblsum'), tr(lang, 'tableView'));
    $('bzh').setAttribute('aria-pressed', lang === 'zh'); $('ben').setAttribute('aria-pressed', lang === 'en');
    document.title = FIGID + ' ' + tr(lang, 'title');
    buildControls(); draw();
  }
  function setLang(l) { lang = l; try { localStorage.setItem('fig-lang', l); } catch (e) { } full(); }
  $('bzh').addEventListener('click', function () { setLang('zh'); });
  $('ben').addEventListener('click', function () { setLang('en'); });
  window.addEventListener('message', function (e) { if (e.data && e.data.type === 'fig-lang' && (e.data.lang === 'zh' || e.data.lang === 'en')) setLang(e.data.lang); });

  /* tooltip (all text via textContent) */
  function hideTip() { tipEl.style.display = 'none'; }
  function showTip(id, x, y) {
    var d = FIG.tip ? FIG.tip(id, lang, st) : null; if (!d) { hideTip(); return; }
    tipEl.textContent = '';
    if (d.t) { var h = document.createElement('div'); h.className = 'tt'; h.textContent = d.t; tipEl.appendChild(h); }
    (d.rows || []).forEach(function (r) {
      var row = document.createElement('div'); row.className = 'r';
      if (r.c) { var sw = document.createElement('span'); sw.className = 'sw'; sw.style.borderColor = r.c; row.appendChild(sw); }
      if (r.v != null) { var v = document.createElement('span'); v.className = 'v'; v.textContent = r.v; row.appendChild(v); }
      if (r.k) { var k = document.createElement('span'); k.className = 'k'; k.textContent = r.k; row.appendChild(k); }
      tipEl.appendChild(row);
    });
    if (d.n) { var n = document.createElement('div'); n.className = 'n'; n.textContent = d.n; tipEl.appendChild(n); }
    tipEl.style.display = 'block';
    var w = tipEl.offsetWidth, h2 = tipEl.offsetHeight, px = x + 14, py = y + 14;
    if (px + w > window.innerWidth - 4) px = Math.max(4, x - w - 14);
    if (py + h2 > window.innerHeight - 4) py = Math.max(4, y - h2 - 14);
    tipEl.style.left = px + 'px'; tipEl.style.top = py + 'px';
  }
  function tipTarget(e) { var t = e.target; while (t && t !== mount) { if (t.getAttribute && t.getAttribute('data-tip')) return t; t = t.parentNode; } return null; }
  mount.addEventListener('pointermove', function (e) { var t = tipTarget(e); if (t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else hideTip(); });
  mount.addEventListener('pointerleave', hideTip);
  mount.addEventListener('focusin', function (e) { var t = tipTarget(e); if (t) { var r = t.getBoundingClientRect(); showTip(t.getAttribute('data-tip'), r.left + r.width / 2, r.top); } });
  mount.addEventListener('focusout', hideTip);
  mount.addEventListener('click', function (e) {
    var t = e.target; while (t && t !== mount) { if (t.getAttribute && t.getAttribute('data-click')) break; t = t.parentNode; }
    if (t && t !== mount && FIG.click && FIG.click(t.getAttribute('data-click'), st)) draw();
  });
  mount.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target; if (t && t.getAttribute && t.getAttribute('data-click')) { e.preventDefault(); if (FIG.click && FIG.click(t.getAttribute('data-click'), st)) draw(); }
  });
  full();
})();

</script>
