const PAL={paper:'#fffbe8',ink:'#1d3f63',muted:'#557489',cream:'#fff3b8',mint:'#d3f6ef',hum:'#e3a700',mut:'#f08a3a',sel:'#ef4c72',pro:'#3b9cba'};
const ORDER=['hum','mut','sel','pro'];
const BADGE_ORDER=['mut','sel','pro','hum'];
const FONT='"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function mix(c,d,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const a=p(c),b=p(d);return '#'+a.map((v,i)=>Math.round(v*t+b[i]*(1-t)).toString(16).padStart(2,'0')).join('');}
function cw(ch,size){const c=ch.charCodeAt(0);if(c>=0x2E80)return size;if(/[A-Z]/.test(ch))return size*0.72;if(/[ilI.,;:'|!]/.test(ch))return size*0.3;if(ch===' ')return size*0.3;return size*0.6;}
function tw(s,size,bold){let w=0;for(const ch of s)w+=cw(ch,size);return w*(bold?1.06:1);}
function wrap(s,maxw,size){
  const toks=s.match(/[⺀-￿]|[^\s⺀-￿]+\s*|\s+/g)||[];const lines=[];let cur='';
  for(const t of toks){if(tw((cur+t).replace(/\s+$/,''),size)>maxw&&cur){lines.push(cur.replace(/\s+$/,''));cur=t.replace(/^\s+/,'');}else cur+=t;}
  if(cur)lines.push(cur.replace(/\s+$/,''));return lines;
}
function tx(x,y,s,o){o=o||{};const size=o.size||12;
  let a='<text x="'+x+'" y="'+y+'" font-size="'+size+'"'+(o.weight?' font-weight="'+o.weight+'"':'')+' fill="'+(o.fill||PAL.ink)+'"'+(o.anchor?' text-anchor="'+o.anchor+'"':'')+(o.halo?' paint-order="stroke" stroke="'+PAL.paper+'" stroke-width="4" stroke-linejoin="round"':'')+'>';
  const ls=Array.isArray(s)?s:[s];
  a+=ls.map((l,i)=>i?'<tspan x="'+x+'" dy="'+(o.lh||size*1.3)+'">'+esc(l)+'</tspan>':esc(l)).join('');
  return a+'</text>';}
function anchorPt(n,side,off){const [x,y,w,h]=n;
  if(side==='l')return [x,y+off];if(side==='r')return [x+w,y+off];
  if(side==='t')return [x+off,y];return [x+off,y+h];}
function renderSvg(gi,lang,st){
  st=st||{};const act=st.act||{};const G=GENS[gi],D=T[lang],GD=D.gens[gi];
  const stat=!!st.stat;const top=stat?50:0;const H=G.H+top;
  const any=ORDER.some(k=>act[k]);
  const first=tags=>ORDER.find(k=>tags.indexOf(k)>=0&&act[k]);
  const nodeLit={},endp={};
  G.edges.forEach(e=>{if(any&&first(e.tags||[])){endp[e.a[0]]=1;endp[e.b[0]]=1;}});
  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+G.W+' '+H+'" width="'+G.W+'" height="'+H+'" font-family=\''+FONT+'\' role="group" aria-label="'+esc(GD.name)+'">';
  s+='<title>'+esc(D.title+' - '+GD.name)+'</title>';
  s+='<defs>';
  [['ink',PAL.ink],['hum',PAL.hum],['mut',PAL.mut],['sel',PAL.sel],['pro',PAL.pro]].forEach(m=>{
    s+='<marker id="ah-'+m[0]+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5 0.8 L9.5 5 L0.5 9.2 Z" fill="'+m[1]+'"/></marker>';});
  s+='</defs>';
  if(stat)s+='<rect width="'+G.W+'" height="'+H+'" fill="'+PAL.paper+'"/>'+tx(12,24,D.figno+'  '+GD.name,{size:16,weight:700})+tx(12,42,GD.intro,{size:11,fill:PAL.muted});
  s+='<g transform="translate(0,'+top+')">';
  // edges
  G.edges.forEach(e=>{
    const na=G.nodes[e.a[0]],nb=G.nodes[e.b[0]];
    const p0=anchorPt(na,e.a[1],e.a[2]),p1=anchorPt(nb,e.b[1],e.b[2]);
    const pts=[p0].concat(e.via||[],[p1]);
    const f=first(e.tags||[]);const lit=!!f;
    const col=f?PAL[f]:(e.color?PAL[e.color]:PAL.ink);const mk=f||e.color||'ink';
    const op=any?(lit?1:0.18):1;
    s+='<g class="edge" data-edge="'+e.id+'" opacity="'+op+'">';
    s+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="'+(lit?3:2)+'"'+(e.dash?' stroke-dasharray="7 5"':'')+' stroke-linejoin="round" marker-end="url(#ah-'+mk+')"'+(e.bi?' marker-start="url(#ah-'+mk+')"':'')+'/>';
    s+='</g>';
  });
  // nodes
  const nodeIds=Object.keys(G.nodes);
  nodeIds.forEach(id=>{
    const [x,y,w,h,tags]=G.nodes[id];const nd=GD.nodes[id];
    const f=first(tags);const lit=!any||!!f;
    const selected=st.sel===id;
    const op=!any?1:((f||selected)?1:(endp[id]?0.55:0.2));
    const base=tags.indexOf('hum')>=0?PAL.cream:'#ffffff';
    const fill=selected?PAL.mint:(f?mix(PAL[f],'#ffffff',0.2):base);
    const stroke=f?PAL[f]:PAL.ink;
    s+='<g class="node" data-node="'+id+'" opacity="'+op+'"'+(stat?'':' tabindex="0" role="button" aria-pressed="'+(selected?'true':'false')+'" aria-label="'+esc(nd.n+(nd.s?' '+nd.s:'')+' - '+nd.short)+'"')+'>';
    s+='<rect x="'+(x+4)+'" y="'+(y+4)+'" width="'+w+'" height="'+h+'" rx="9" fill="rgba(29,63,99,.22)"/>';
    s+='<rect class="body" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(f||selected?3.2:2)+'"/>';
    // name
    let ns=13.5;while(ns>11&&tw(nd.n,ns,1)>w-22)ns-=0.5;
    if(nd.s){s+=tx(x+w/2,y+20,nd.n,{size:ns,weight:700,anchor:'middle'});
      let ss=10.5;while(ss>8.5&&tw(nd.s,ss)>w-14)ss-=0.5;
      s+=tx(x+w/2,y+36,nd.s,{size:ss,fill:PAL.muted,anchor:'middle'});}
    else s+=tx(x+w/2,y+h/2+5,nd.n,{size:ns,weight:700,anchor:'middle'});
    // badges
    const bt=BADGE_ORDER.filter(k=>tags.indexOf(k)>=0);
    bt.forEach((k,i)=>{const bx=x+w-8-18*(bt.length-i)+0, by=y-8;
      s+='<rect x="'+bx+'" y="'+by+'" width="16" height="15" rx="4" fill="'+PAL.paper+'" stroke="'+PAL[k]+'" stroke-width="'+(act[k]?2.6:1.8)+'"/>'+tx(bx+8,by+11.5,D.badge[k],{size:10,weight:700,anchor:'middle'});});
    s+='<title>'+esc(nd.n+' - '+nd.d)+'</title>';
    s+='</g>';
  });
  // notes (below nodes)
  nodeIds.forEach(id=>{
    const [x,y,w,h,_t,o]=G.nodes[id];const nd=GD.nodes[id];const ov=o||{};
    const nx=ov.x!=null?ov.x:x+2;const mw=ov.w||Math.min(w+30,G.W-x-6);const ls=wrap(nd.short,mw,10.5);
    const op=!any?1:((first(G.nodes[id][4])||st.sel===id)?1:(endp[id]?0.55:0.2));
    s+='<g opacity="'+op+'">'+tx(nx,y+h+16,ls,{size:10.5,fill:PAL.muted,halo:1,lh:12.5,anchor:ov.a})+'</g>';
  });
  // edge labels
  G.edges.forEach(e=>{if(!e.lab)return;const lit=!!first(e.tags||[]);const op=any?(lit?1:0.18):1;
    s+='<g opacity="'+op+'">'+tx(e.lab[1],e.lab[2],GD.labels[e.lab[0]],{size:11,weight:700,anchor:e.lab[3],halo:1})+'</g>';});
  s+='</g>';
  // legend
  let lx=12;const ly=H-22;
  s+='<g>';
  BADGE_ORDER.forEach(k=>{
    s+='<rect x="'+lx+'" y="'+(ly-11)+'" width="16" height="15" rx="4" fill="'+PAL.paper+'" stroke="'+PAL[k]+'" stroke-width="2"/>'+tx(lx+8,ly+0.5,D.badge[k],{size:10,weight:700,anchor:'middle'});
    const lab=D.legend[k];s+=tx(lx+22,ly+1,lab,{size:11});lx+=22+tw(lab,11)+16;});
  s+='<line x1="'+lx+'" y1="'+(ly-3)+'" x2="'+(lx+32)+'" y2="'+(ly-3)+'" stroke="'+PAL.ink+'" stroke-width="2" marker-end="url(#ah-ink)"/>'+tx(lx+38,ly+1,D.legend.solid,{size:11});lx+=38+tw(D.legend.solid,11)+16;
  s+='<line x1="'+lx+'" y1="'+(ly-3)+'" x2="'+(lx+32)+'" y2="'+(ly-3)+'" stroke="'+PAL.ink+'" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-ink)"/>'+tx(lx+38,ly+1,D.legend.dash,{size:11});
  s+='</g></svg>';
  return s;
}

const BUILD_GW=[820,820,780];

const $=id=>document.getElementById(id);
const COL={mut:'#f08a3a',sel:'#ef4c72',pro:'#3b9cba',hum:'#e3a700'};
function buildCtl(){const D=T[lang];
  $('figno').textContent=D.figno;$('title').textContent=D.title;document.title=D.figno+' - '+D.title;document.documentElement.lang=lang;
  $('tabs').setAttribute('aria-label',D.tabsAria);$('togs').setAttribute('aria-label',D.togAria);

  $('togs').innerHTML=['mut','sel','pro','hum'].map(k=>'<button class="tog" data-k="'+k+'" style="--c:'+COL[k]+'" aria-pressed="'+act[k]+'" title="'+D.togTip[k]+'"><i></i>'+D.tog[k]+'</button>').join('');
  $('tblsum').textContent=D.tblSum;
}
function panel(){const D=T[lang],GD=D.gens[gi];let h='';
  if(selId){const n=GD.nodes[selId],tags=GENS[gi].nodes[selId][4];

function table(){const D=T[lang],GD=D.gens[gi],G=GENS[gi];

function draw(focusId){
